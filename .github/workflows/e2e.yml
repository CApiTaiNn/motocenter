name: UI tests (Playwright)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      # UI tests mock every backend call (see uitest/support/mock.ts), so no
      # backend or database is needed here.
      - run: npx playwright install --with-deps chromium
      # Serve a production build in CI (playwright.config.ts runs `nuxt preview`
      # when CI is set) — no on-demand compilation, so the suite is stable under
      # parallel load. The build must exist before the tests start.
      - run: npm run build
      # PW_RECORD=1 records a video + trace for every test (even passing ones) so
      # you can watch each flow in the HTML report. Remove this env line to keep
      # artifacts lean again (media then only kept on failure).
      - run: npm run test:ui
        env:
          PW_RECORD: '1'

      # The HTML report is a full browsable site: open it to see every test's
      # steps, screenshots, video and trace.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
